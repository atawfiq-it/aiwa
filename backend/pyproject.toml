[project]
name = "aiwa-backend"
version = "0.1.0"
description = "Local Multimodal AI Workstation Core Backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.2",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "pymupdf>=1.24.9",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.2",
    "nvidia-ml-py>=12.560.30",
    "lancedb>=0.13.0",
    "fastembed>=0.3.4",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.2",
    "pre-commit>=3.8.0",
    "pyinstaller>=6.10.0",
    "huggingface-hub>=0.24.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "mlx-lm>=0.19.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.2",
    "pre-commit>=3.8.0",
]
audio = [
    "faster-whisper>=1.0.3",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "kokoro>=0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Direct Hatchling to use 'app' as the package
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # allow FastAPI Depends() in argument defaults
    "E501", # disable line-length enforcement on format and lint
    ]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"] # Ignore line length on auto-generated migrations

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
