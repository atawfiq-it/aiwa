repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10240'] # Protect against accidental GGUF / model commits

  - repo: local
    hooks:
      - id: block-sensitive-files
        name: Block Private Data & Model Checkpoints
        entry: bash -c 'for f in "$@"; do if [[ "$f" =~ \.(db|sqlite|sqlite3|gguf|safetensors|ckpt)$ || "$f" =~ \.aiwa_session_token  ]]; then echo "❌ Commit Blocked:-Sensitive file detected:- $f"; exit 1; fi; done' --
        language: system
        stages: [commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
